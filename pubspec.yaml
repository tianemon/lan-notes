name: lan_notes
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # sqlite3_flutter_libs 0.6.0+eol 为 EOL 空壳包（官方提示升级 sqlite3 3.x）；
  # 保留依赖以符合技术栈清单（drift_flutter 也约束 ^0.6.0+eol）。
  # SQLite 实际来源（见下方 hooks 配置 + jniLibs）：
  #   - Windows/macOS/iOS/Linux：系统库（source: system，Windows 用 winsqlite3，构建离线）；
  #   - Android：android/app/src/main/jniLibs/ 预编译 libsqlite3.so（task-10 修复，
  #     来自 eu.simonbinder:sqlite3-native-library:3.52.0 AAR，构建离线）。
  sqlite3_flutter_libs: ^0.6.0+eol
  # flutter_riverpod 2.6.1：当前 Dart 3.10.4 下可用最新稳定版（3.x 需 Dart 3.12+，
  # 且 3.x 依赖 test 包与 flutter_test 冲突无法解析）；API 与架构文档第 6 节一致
  flutter_riverpod: ^2.6.1
  go_router: ^17.4.0
  web_socket_channel: ^3.0.3
  uuid: ^4.6.0
  # HMAC-SHA256 挑战认证（task-27 v4：配对密钥计算，dart 官方 crypto 包）
  crypto: ^3.0.6
  # 富文本（task-29）：flutter_quill v11 最新稳定——编辑页正文所见即所得，
  # content 存 delta JSON；QuillSimpleToolbar 精简工具栏 + 自定义插图按钮。
  flutter_quill: ^11.5.1
  # 本地插图选图（task-29）：file_picker 统一跨平台（桌面文件选择 / 移动端相册文件）。
  file_picker: ^10.0.0
  # 图片保存到相册（移动端，task-31 图片保存本地）：Android 13+ 免权限，iOS 需相册权限（已配 Info.plist）
  gal: ^2.3.0
  # 附件目录（task-29）：应用支持目录 attachments/（path_provider）。
  path_provider: ^2.1.6
  # flutter_quill 工具栏本地化必需（task-29）：不带 delegate 会抛异常。
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # 附件路径拼接（task-29）。
  path: ^1.9.1
# 本地 fork：优化移动端选区手柄的拖拽手感。
#
# 原因：手柄的拖拽逻辑在**未导出**的 _TextSelectionHandleOverlay
# （third_party/flutter_quill/lib/src/editor/widgets/text/text_selection.dart）
# 里，三处问题都无法通过 QuillEditorConfig 从外部覆盖：
#   1. 把手指坐标直接当文本位置用（手柄画在文字下方 → 命中相邻行）；
#   2. dragStartBehavior 为 start，按住停顿后会被编辑器的长按手势抢走；
#   3. 拖到对端直接 return，且选区折叠会 dispose 整个 overlay（手柄消失）。
# 只改行为，**不动手柄外观**（外观改动方案已试过三版，均被否决）。
#
# 不走 git 依赖：本环境 GitHub 不可达（sqlite3 已因同样原因改为本地打包）。
# 副本来源：~/.pub-cache/hosted/pub.dev/flutter_quill-11.5.1（已删 example/test/doc）。
# 升级上游时：重新复制同版本源码，再把 third_party/flutter_quill.patch 重放一遍。
# ⚠️ third_party/ 必须提交进 git，否则别的设备 pub get 会失败（lock 里 relative: true）。
dependency_overrides:
  flutter_quill:
    path: third_party/flutter_quill

dev_dependencies:
  flutter_test:
    sdk: flutter

  # drift 代码生成器：固定 2.34.0（2.34.1+ 依赖 analyzer ^13.0.0，与
  # Flutter 3.38.5 SDK 固定的 meta 1.17.0 冲突，无法解析）
  drift_dev: 2.34.0
  build_runner: ^2.4.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# sqlite3 3.x 默认通过 native assets 从 GitHub 下载预编译库；
# 当前环境无法访问 GitHub，改为：
#   - Windows：winsqlite3.dll（系统自带）
#   - macOS/iOS/Linux：系统 libsqlite3
#   - Android：无系统库可 dlopen，改为打包预编译 libsqlite3.so（见
#     android/app/src/main/jniLibs/，task-10 修复；运行时 sqlite3 的
#     DynamicLoadingSystem('libsqlite3.so') 命中 APK 内打包的 .so）
# 完全离线，构建不依赖外部下载。
hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

